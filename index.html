<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Ánh Dương - Hệ Thống Quản Lý</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#1a56db">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ánh Dương">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Hiện đẹp khi gửi link qua Zalo / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ánh Dương - Hệ Thống Quản Lý">
  <meta property="og:description" content="Hệ thống quản lý nội bộ Công ty Ánh Dương">
  <meta property="og:image" content="https://pmpjk001vn.github.io/AD/icon-512.png">

  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#fff; }
    iframe { border:0; width:100%; height:100%; display:block; }
  </style>
</head>
<body>

  <iframe id="app" allow="clipboard-write; fullscreen; autoplay"></iframe>

  <script>
    // ============================================================
    // THAY LINK WEB APP CỦA BẠN VÀO ĐÂY (kết thúc bằng /exec)
    // ============================================================
    const APP_URL = "https://script.google.com/macros/s/AKfycbygOxtYphLgfzc5-Yug1KTDDraH_PCevRhYzMi0NkRaoSAeALXXENdT4KuzEYEsBUA/exec";
    // ============================================================

    // Chuyển tiếp tham số auto-login (?u=...&p=...) vào trong app
    document.getElementById('app').src = APP_URL + window.location.search;

    // Xóa mật khẩu khỏi thanh địa chỉ sau khi đã chuyển vào app
    if (window.location.search.indexOf('p=') !== -1) {
      setTimeout(function () {
        try { history.replaceState(null, '', window.location.pathname); } catch (e) {}
      }, 1500);
    }

    // Đăng ký service worker để cài được thành app
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
